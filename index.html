<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alain - Pronostic IA Football</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* DESACTIVATION DU FLASH BLEU SUR MOBILE ET ANTI-SELECTION DE TEXTE */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Autoriser la saisie uniquement dans les champs texte */
    input, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255,255,255,0.1);
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), #1e293b);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 30px;
    }

    header { text-align: center; margin-bottom: 40px; }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 10px 0;
      background: linear-gradient(to right, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge-live {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 15px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(to right, var(--accent-primary), var(--accent-green));
    }

    .input-group { margin-bottom: 25px; position: relative; }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .vs-divider {
      text-align: center;
      margin: 10px 0 35px 0;
      position: relative;
    }

    .vs-divider::before, .vs-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border-color);
    }

    .vs-divider::before { left: 0; }
    .vs-divider::after { right: 0; }
    .vs-text {
      background: var(--bg-dark);
      padding: 5px 15px;
      border-radius: 20px;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      display: inline-block;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-primary);
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: white;
      border: none;
      padding: 18px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-submit:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Modale (Pop-up) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-dark);
      width: 90%;
      max-width: 500px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      padding: 30px;
      transform: translateY(20px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .modal-close:hover { background: rgba(255,255,255,0.2); }

    .result-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .result-match-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 10px;
    }

    .result-section {
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      border-left: 4px solid var(--accent-primary);
    }

    .result-section h3 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .result-section p { margin: 0; line-height: 1.6; font-size: 1.05rem; }

    .confiance-bar-bg {
      background: rgba(255,255,255,0.1);
      height: 8px;
      border-radius: 4px;
      margin-top: 10px;
      overflow: hidden;
    }

    .confiance-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-green));
      border-radius: 4px;
      transition: width 1s ease-out;
    }

    .ticket-section {
      border-left-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.05);
    }

    .ticket-section h3 { color: var(--accent-green); }
    .ticket-section p { font-weight: 600; font-size: 1.1rem; }

    .loader-container {
      text-align: center;
      padding: 40px 0;
    }

    .ballon-loader {
      font-size: 3rem;
      animation: spin-bounce 1.5s infinite;
      display: inline-block;
      margin-bottom: 20px;
    }

    @keyframes spin-bounce {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
      100% { transform: translateY(0) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge-live"><span></span> Analyse en direct</div>
      <h1>ALAIN <span>⚽</span> PRONOSTIC IA</h1>
      <p style="color: var(--text-muted);">Ton expert football personnel — analyse et ticket combiné instantané.</p>
    </header>

    <div class="card">
      <div class="input-group">
        <label>Équipe Domicile</label>
        <input type="text" id="equipeA" class="input-field" placeholder="Ex: Real Madrid" autocomplete="off">
      </div>

      <div class="vs-divider">
        <span class="vs-text">CONTRE</span>
      </div>

      <div class="input-group">
        <label>Équipe Extérieure</label>
        <input type="text" id="equipeB" class="input-field" placeholder="Ex: Barcelone" autocomplete="off">
      </div>

      <div class="input-group" style="margin-top: 30px;">
        <label>Contexte du match (Optionnel)</label>
        <div class="tags-container" id="tagsContext">
          <div class="tag" data-value="Match couperet (Élimination directe)">🏆 Match couperet</div>
          <div class="tag" data-value="Absence d'un joueur clé">🤕 Absence clé</div>
          <div class="tag" data-value="Derby à haute tension">🔥 Derby</div>
          <div class="tag" data-value="Enjeu crucial pour le classement">📈 Enjeu classement</div>
          <div class="tag" data-value="Équipe en sortie de crise">📉 Sortie crise</div>
        </div>
      </div>

      <button id="btn-prono" class="btn-submit" onclick="lancerAnalyse()">
        <span id="btn-texte">Générer le Pronostic IA</span>
        <span>⚡</span>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="modalResultat">
    <div class="modal-content">
      <button class="modal-close" onclick="fermerModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // --- PROTECTION ANTI COPIÉ / COLLÉ & CLIC DROIT ---
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());

    // --- CACHE & LOGIQUE APP ---
    const cachePronostics = {};
    let requeteEnCours = false;

    const tags = document.querySelectorAll('.tag');
    let contextesSelectionnes = [];

    tags.forEach(tag => {
      tag.addEventListener('click', () => {
        tag.classList.toggle('active');
        const valeur = tag.getAttribute('data-value');
        if (tag.classList.contains('active')) {
          contextesSelectionnes.push(valeur);
        } else {
          contextesSelectionnes = contextesSelectionnes.filter(v => v !== valeur);
        }
      });
    });

    function ouvrirModal() {
      document.getElementById('modalResultat').classList.add('active');
    }

    function fermerModal() {
      if(!requeteEnCours) {
        document.getElementById('modalResultat').classList.remove('active');
      }
    }

    async function lancerAnalyse() {
      if (requeteEnCours) return;

      const equipeA = document.getElementById('equipeA').value.trim();
      const equipeB = document.getElementById('equipeB').value.trim();

      if (!equipeA || !equipeB) {
        alert("Veuillez entrer les deux équipes.");
        return;
      }

      const contexteTexte = contextesSelectionnes.join(", ");
      const cleCache = `${equipeA}-${equipeB}-${contexteTexte}`.toLowerCase();

      const btn = document.getElementById('btn-prono');
      const btnTexte = document.getElementById('btn-texte');
      btn.disabled = true;
      btnTexte.textContent = "Analyse...";

      document.getElementById('modalBody').innerHTML = `
        <div class="loader-container">
          <div class="ballon-loader">⚽</div>
          <h3 style="color:var(--accent-primary); margin-bottom:10px;">L'IA analyse le match...</h3>
          <p style="color:var(--text-muted); font-size:0.9rem;">Traitement des statistiques et du contexte en cours.</p>
        </div>
      `;
      ouvrirModal();

      if (cachePronostics[cleCache]) {
        setTimeout(() => {
          traiterEtAfficherResultat(equipeA, equipeB, cachePronostics[cleCache]);
          btn.disabled = false;
          btnTexte.textContent = "Générer un autre Pronostic";
        }, 800);
        return;
      }

      requeteEnCours = true;

      const prompt = `Tu es un expert en football et en paris sportifs. Analyse le match : ${equipeA} vs ${equipeB}.
${contexteTexte ? "Contexte additionnel : " + contexteTexte + "." : ""}
Réponds STRICTEMENT au format suivant, sans aucun autre texte :
FORME: [analyse de la forme en 2 phrases]
PRONOSTIC: [pronostic principal clair]
CONFIANCE: [nombre entre 0 et 100]
TICKET: [suggestion de pari combiné]`;

      try {
        const reponse = await fetch("/.netlify/functions/api-gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await reponse.json();

        if (!reponse.ok || data.error) {
          throw new Error(data?.error?.message || "Erreur serveur");
        }

        const texteBrut = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!texteBrut) throw new Error("Réponse vide de l'IA");

        cachePronostics[cleCache] = texteBrut;
        traiterEtAfficherResultat(equipeA, equipeB, texteBrut);

      } catch (erreur) {
        document.getElementById('modalBody').innerHTML = `
          <div class="result-header">
            <h2 style="color: #ef4444;">❌ Erreur d'analyse</h2>
          </div>
          <p style="text-align:center;">Une erreur est survenue avec l'IA. <br>Détail : ${erreur.message}</p>
          <button class="btn-submit" onclick="fermerModal()" style="margin-top:20px;">Fermer</button>
        `;
      } finally {
        requeteEnCours = false;
        btn.disabled = false;
        btnTexte.textContent = "Générer un autre Pronostic";
      }
    }

    function traiterEtAfficherResultat(equipeA, equipeB, texteBrut) {
      const formeMatch = texteBrut.match(/FORME:\s*(.*)/i);
      const pronoMatch = texteBrut.match(/PRONOSTIC:\s*(.*)/i);
      const confMatch = texteBrut.match(/CONFIANCE:\s*(\d+)/i);
      const ticketMatch = texteBrut.match(/TICKET:\s*(.*)/i);

      const forme = formeMatch ? formeMatch[1].trim() : "Analyse non disponible.";
      const pronostic = pronoMatch ? pronoMatch[1].trim() : "Pronostic non défini.";
      const confiance = confMatch ? parseInt(confMatch[1]) : 50;
      const ticket = ticketMatch ? ticketMatch[1].trim() : "Aucun ticket suggéré.";

      let couleurConf = 'var(--accent-primary)';
      if(confiance >= 75) couleurConf = 'var(--accent-green)';
      else if(confiance < 50) couleurConf = '#ef4444';

      document.getElementById('modalBody').innerHTML = `
        <div class="result-header">
          <div class="result-match-title">${equipeA.toUpperCase()} <span style="color:var(--text-muted); font-size:1rem;">VS</span> ${equipeB.toUpperCase()}</div>
        </div>

        <div class="result-section">
          <h3>📊 Forme & Dynamique</h3>
          <p>${forme}</p>
        </div>

        <div class="result-section">
          <h3>🎯 Verdict de l'IA</h3>
          <p style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">${pronostic}</p>

          <div style="margin-top: 15px; display:flex; justify-content:space-between; font-size:0.9rem; font-weight:600;">
            <span>Indice de confiance</span>
            <span style="color:${couleurConf}">${confiance}%</span>
          </div>
          <div class="confiance-bar-bg">
            <div class="confiance-bar-fill" style="width: 0%; background: ${couleurConf};"></div>
          </div>
        </div>

        <div class="result-section ticket-section">
          <h3>💡 Ticket Suggéré</h3>
          <p>${ticket}</p>
        </div>
      `;

      setTimeout(() => {
        const barFill = document.querySelector('.confiance-bar-fill');
        if(barFill) barFill.style.width = `${confiance}%`;
      }, 100);
    }
  </script>
</body>
</html>
